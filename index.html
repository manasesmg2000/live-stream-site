<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directo en vivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      width: 100%;
      background: #1a1a1a;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      border-bottom: 2px solid #ff0000;
    }

    header .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    header .logo span { color: #ff0000; }

    .live-badge {
      background: #ff0000;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    main {
      margin-top: 80px;
      width: 100%;
      max-width: 1100px;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Estado: SIN DIRECTO ── */
    #no-live {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    #no-live .icon {
      font-size: 5rem;
      opacity: 0.3;
    }

    #no-live h2 {
      font-size: 2rem;
      font-weight: 700;
      opacity: 0.7;
    }

    #no-live p {
      font-size: 1rem;
      opacity: 0.5;
      max-width: 380px;
    }

    /* ── Estado: CON DIRECTO ── */
    #live-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,0,0,0.3);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .stream-info {
      font-size: 0.85rem;
      opacity: 0.4;
    }

    /* Ocultar/mostrar secciones */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎥 Mi <span>Canal</span></div>
    <div id="badge" class="live-badge hidden">● EN DIRECTO</div>
  </header>

  <main>
    <!-- Sin directo -->
    <div id="no-live">
      <div class="icon">📡</div>
      <h2>No hay directo disponible</h2>
      <p>Vuelve más tarde. Cuando empiece el directo, aparecerá aquí automáticamente.</p>
    </div>

    <!-- Con directo -->
    <div id="live-container" class="hidden">
      <div class="video-wrapper">
        <iframe
          id="yt-iframe"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
      <div class="stream-info" id="stream-info"></div>
    </div>
  </main>

  <script>
    // ──────────────────────────────────────────────
    // CONFIGURACIÓN: cambia esto por tu repo
    // ──────────────────────────────────────────────
    const CONFIG_URL = 'https://raw.githubusercontent.com/manasesmg2000/live-stream-site/main/config.json';
    // ──────────────────────────────────────────────

    function extractVideoId(input) {
      input = input.trim();
      // Si ya es un ID limpio (11 caracteres alfanuméricos/guiones)
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      // Intentar extraer de URL de YouTube
      const patterns = [
        /[?&]v=([a-zA-Z0-9_-]{11})/,
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /embed\/([a-zA-Z0-9_-]{11})/,
        /live\/([a-zA-Z0-9_-]{11})/,
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      return input; // devolver tal cual si no se puede parsear
    }

    async function loadConfig() {
      try {
        const res = await fetch(CONFIG_URL + '?nocache=' + Date.now());
        const cfg = await res.json();

        const noLive = document.getElementById('no-live');
        const liveContainer = document.getElementById('live-container');
        const badge = document.getElementById('badge');
        const iframe = document.getElementById('yt-iframe');
        const info = document.getElementById('stream-info');

        if (cfg.live && cfg.videoId) {
          const vid = extractVideoId(cfg.videoId);
          noLive.classList.add('hidden');
          liveContainer.classList.remove('hidden');
          badge.classList.remove('hidden');
          iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=0`;
          info.textContent = `ID del vídeo: ${vid}`;
          document.title = '🔴 Directo en vivo';
        } else {
          noLive.classList.remove('hidden');
          liveContainer.classList.add('hidden');
          badge.classList.add('hidden');
          iframe.src = '';
          document.title = 'Directo en vivo';
        }
      } catch (e) {
        console.error('No se pudo cargar config.json:', e);
      }
    }

    // Cargar al inicio
    loadConfig();

    // Refrescar cada 60 segundos por si cambia el config
    setInterval(loadConfig, 60000);
  </script>
</body>
</html>
