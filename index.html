<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia de Pan Bendito — Directo</title>
  <!-- Google Cast SDK para habilitar la detección nativa de dispositivos de emisión -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    :root {
      --navy:      #1a2740;
      --navy-mid:  #223054;
      --navy-light:#2e3f6a;
      --silver:    #c8d4e8;
      --silver-bright: #e8eef8;
      --gold:      #a8b8d0;
      --accent:    #7090c0;
      --white:     #f0f4fc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #0d1624 0%, var(--navy) 50%, #0d1624 100%);
      color: var(--white);
      font-family: 'Segoe UI', Georgia, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      background: linear-gradient(90deg, #0d1624 0%, var(--navy-mid) 50%, #0d1624 100%);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(160,185,220,0.25);
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .header-logo {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(200,212,232,0.4);
      box-shadow: 0 0 14px rgba(100,140,200,0.3);
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-title .main-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--silver-bright);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .header-title .sub-name {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Badge EN DIRECTO */
    .live-badge {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: pulse 1.6s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(231,76,60,0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(231,76,60,0.5); }
      50%       { opacity: 0.6; box-shadow: 0 0 4px rgba(231,76,60,0.2); }
    }

    /* Botón canal YouTube */
    .btn-yt {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--navy-light), var(--navy-mid));
      border: 1px solid rgba(160,185,220,0.3);
      color: var(--silver-bright);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 24px;
      text-decoration: none;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .btn-yt:hover {
      background: linear-gradient(135deg, #3a5080, var(--navy-light));
      border-color: rgba(160,185,220,0.6);
      box-shadow: 0 0 16px rgba(100,140,200,0.25);
      transform: translateY(-1px);
    }

    .btn-yt svg { flex-shrink: 0; }

    /* ── MAIN ── */
    main {
      width: 100%;
      max-width: 1100px;
      padding: 36px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      flex: 1;
    }

    /* ── SIN DIRECTO ── */
    #no-live {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      padding: 40px 20px;
    }

    .no-live-logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(160,185,220,0.35);
      box-shadow:
        0 0 0 1px rgba(160,185,220,0.1),
        0 0 40px rgba(60,90,140,0.4);
      opacity: 0.85;
    }

    #no-live h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--silver);
      letter-spacing: 0.5px;
    }

    #no-live p {
      font-size: 0.95rem;
      color: var(--accent);
      max-width: 400px;
      line-height: 1.7;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    /* ── CON DIRECTO ── */
    #live-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(160,185,220,0.15),
        0 8px 40px rgba(0,0,0,0.6),
        0 0 60px rgba(50,80,130,0.2);
    }

    .corner-cast-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(13, 22, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .corner-cast-btn:hover {
      background: rgba(231, 76, 60, 0.95);
      border-color: #ff8585;
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(231, 76, 60, 0.6);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(160,185,220,0.25);
      color: var(--silver-bright);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-action:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(160,185,220,0.5);
      transform: translateY(-1px);
    }

    .btn-cast {
      background: linear-gradient(135deg, #1d365d, #2a4c80);
      border: 1px solid rgba(160,200,255,0.45);
      color: #ffffff;
    }

    .btn-cast:hover {
      background: linear-gradient(135deg, #254677, #355f9e);
      border-color: rgba(180,220,255,0.8);
      box-shadow: 0 0 16px rgba(80,150,255,0.35);
    }

    .stream-info {
      font-size: 0.78rem;
      color: var(--accent);
      opacity: 0.6;
    }

    /* ── FOOTER ── */
    footer {
      width: 100%;
      text-align: center;
      padding: 18px;
      font-size: 0.75rem;
      color: rgba(160,185,220,0.35);
      border-top: 1px solid rgba(160,185,220,0.08);
      letter-spacing: 0.5px;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .header-title .main-name { font-size: 0.95rem; }
      .btn-yt span { display: none; }
      .no-live-logo { width: 110px; height: 110px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="logo.jpg" alt="Logo Iglesia de Pan Bendito" class="header-logo" />
      <div class="header-title">
        <span class="main-name">Iglesia de Pan Bendito</span>
        <span class="sub-name">Iglesia Evangélica</span>
      </div>
    </div>

    <div class="header-right">
      <div id="badge" class="live-badge hidden">● EN DIRECTO</div>
      <a
        href="https://www.youtube.com/@pambenditoTV"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-yt"
        title="Ir al canal de YouTube"
      >
        <!-- Icono YouTube -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF0000"/>
          <path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="white"/>
        </svg>
        <span>Nuestro canal</span>
      </a>
    </div>
  </header>

  <main>

    <!-- ── Sin directo ── -->
    <div id="no-live">
      <img src="logo.jpg" alt="Pan Bendito" class="no-live-logo" />
      <div class="divider"></div>
      <h2>No hay directo disponible</h2>
      <p>Vuelve pronto. Cuando empiece la transmisión en vivo, aparecerá aquí automáticamente.</p>
      <a
        href="https://www.youtube.com/@pambenditoTV"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-yt"
        style="margin-top:8px; padding: 12px 24px; font-size:0.9rem;"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF0000"/>
          <path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="white"/>
        </svg>
        <span>Visitar nuestro canal de YouTube</span>
      </a>
    </div>

    <!-- ── Con directo ── -->
    <div id="live-container" class="hidden">
      <div class="video-wrapper">
        <iframe
          id="yt-iframe"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; presentation; remote-playback; screen-wake-lock"
          allowfullscreen="true">
        </iframe>
        <!-- Botón de Emitir en la esquina superior derecha del vídeo (igual que en YouTube) -->
        <button id="btn-cast-corner" onclick="handleCast()" class="corner-cast-btn" title="Emitir a la TV (Chromecast, Firestick, Smart TV)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
          </svg>
        </button>
      </div>
      <div class="video-actions">
        <button id="btn-cast" onclick="handleCast()" class="btn-action btn-cast" title="Emitir a la televisión / Chromecast">
          <!-- Icono exacto de Chromecast / Emitir -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
          </svg>
          <span>Emitir a TV</span>
        </button>

        <a id="btn-open-yt" href="" target="_blank" rel="noopener noreferrer" class="btn-action">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF0000"/>
            <path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="white"/>
          </svg>
          <span>Abrir en YouTube</span>
        </a>

        <div class="stream-info" id="stream-info"></div>
      </div>
    </div>

  </main>

  <footer>
    © Iglesia de Pan Bendito · Iglesia Evangélica
  </footer>

  <script>
    function extractVideoId(input) {
      input = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const patterns = [
        /[?&]v=([a-zA-Z0-9_-]{11})/,
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /embed\/([a-zA-Z0-9_-]{11})/,
        /live\/([a-zA-Z0-9_-]{11})/,
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      return input;
    }

    const REALTIME_TOPIC = 'https://ntfy.sh/iglesia-pan-bendito-live-channel-v1';
    const CONFIG_API_URL = 'https://api.github.com/repos/manasesmg2000/live-stream-site/contents/config.json?ref=main';

    let currentLiveState = null;
    let currentVideoId   = null;

    function applySignal(rawMsg) {
      if (typeof rawMsg !== 'string') return;
      const msg = rawMsg.trim();
      if (msg.startsWith('LIVE:')) {
        const vid = extractVideoId(msg.substring(5));
        renderUI(true, vid);
      } else if (msg === 'OFFLINE') {
        renderUI(false, '');
      }
    }

    function renderUI(isLive, vid) {
      if (isLive === currentLiveState && vid === currentVideoId) return;
      currentLiveState = isLive;
      currentVideoId   = vid;

      const noLive        = document.getElementById('no-live');
      const liveContainer = document.getElementById('live-container');
      const badge         = document.getElementById('badge');
      const iframe        = document.getElementById('yt-iframe');
      const info          = document.getElementById('stream-info');
      const btnOpenYt     = document.getElementById('btn-open-yt');

      if (isLive && vid) {
        noLive.classList.add('hidden');
        liveContainer.classList.remove('hidden');
        badge.classList.remove('hidden');
        iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&enablejsapi=1`;
        if (btnOpenYt) {
          btnOpenYt.href = `https://www.youtube.com/watch?v=${vid}`;
        }
        info.textContent = `ID del directo: ${vid}`;
        document.title = '🔴 Directo — Iglesia de Pan Bendito';
      } else {
        noLive.classList.remove('hidden');
        liveContainer.classList.add('hidden');
        badge.classList.add('hidden');
        iframe.src = '';
        document.title = 'Iglesia de Pan Bendito — Directo';
      }
    }

    // 1. Conexión en tiempo real instantánea (SSE) - recibe el cambio en 0.05s
    function initRealtime() {
      if (!window.EventSource) return;
      try {
        const sse = new EventSource(`${REALTIME_TOPIC}/sse`);
        sse.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.event === 'message' && data.message) {
              applySignal(data.message);
            }
          } catch (e) {}
        };
      } catch (e) {
        console.warn('SSE fallback:', e);
      }
    }

    // 2. Consulta de estado inicial o respaldo
    async function checkState() {
      // Intentar leer el último mensaje de la cola en tiempo real
      try {
        const res = await fetch(`${REALTIME_TOPIC}/json?poll=1`, { cache: 'no-store' });
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split('\n').filter(Boolean);
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const item = JSON.parse(lines[i]);
              if (item.event === 'message' && item.message) {
                applySignal(item.message);
                return;
              }
            } catch (e) {}
          }
        }
      } catch (e) {}

      // Fallback: leer config.json
      try {
        const resPages = await fetch(`./config.json?_t=${Date.now()}`, { cache: 'no-store' });
        if (resPages.ok) {
          const cfg = await resPages.json();
          if (cfg.live && cfg.videoId) {
            renderUI(true, extractVideoId(cfg.videoId));
          } else {
            renderUI(false, '');
          }
        }
      } catch (e) {}
    }

    function handleCast() {
      if (!currentVideoId) return;
      const vid = extractVideoId(currentVideoId);

      // Si es un dispositivo móvil (Android, iPhone, iPad)
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        // Abre la app de YouTube donde el menú de emisión a Smart TV / Firestick / Chromecast aparece de inmediato
        window.location.href = `vnd.youtube://${vid}`;
        setTimeout(() => {
          window.open(`https://www.youtube.com/watch?v=${vid}`, '_blank');
        }, 600);
        return;
      }

      // En ordenador (Chrome / Edge):
      // 1. Intentar abrir el menú de emisión nativo del navegador (Google Cast / Chromecast)
      if (window.PresentationRequest) {
        try {
          const req = new PresentationRequest([
            `https://www.youtube.com/embed/${vid}?autoplay=1`
          ]);
          req.start().catch(() => {
            window.open(`https://www.youtube.com/watch?v=${vid}`, '_blank');
          });
          return;
        } catch (e) {}
      }

      // 2. Si no, abrir en YouTube para enlazar con TV / Firestick
      window.open(`https://www.youtube.com/watch?v=${vid}`, '_blank');
    }

    // Iniciar conexión en tiempo real inmediata
    initRealtime();

    // Consulta de estado inicial
    checkState();

    // Comprobación periódica de respaldo cada 10 segundos
    setInterval(checkState, 10000);

    // Comprobación al volver a la pestaña
    window.addEventListener('focus', checkState);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkState();
    });
  </script>
</body>
</html>
