name: Compilar App Android e iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'pan_bendito_app/**'
      - 'pan_bendito_admin/**'
      - '.github/workflows/build-app.yml'
      - 'embed.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK para Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de Android con configuracion limpia
        working-directory: ./pan_bendito_app
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          mkdir -p backup_native
          cp -r android/app/src/main/res backup_native/ 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml backup_native/ 2>/dev/null || true
          cp -r android/app/src/main/kotlin backup_native/ 2>/dev/null || true
          
          rm -rf android
          flutter create . --org com.iglesiapanbendito --project-name pan_bendito_app --platforms=android
          cp pubspec.backup.yaml pubspec.yaml
          
          # Restaurar recursos visuales, iconos, MainActivity con MulticastLock y Manifest
          cp -rf backup_native/res/* android/app/src/main/res/ 2>/dev/null || true
          if [ -d "backup_native/kotlin" ]; then
            cp -rf backup_native/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          fi
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "backup_native/AndroidManifest.xml" ]; then
            cp backup_native/AndroidManifest.xml "$MANIFEST"
          else
            sed -i 's/android:label="[^"]*"/android:label="PAN BENDITO" android:usesCleartextTraffic="true" android:allowBackup="false"/g' "$MANIFEST"
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <queries>\n        <package android:name="com.google.android.youtube" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="vnd.youtube" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

          # Configurar certificado release permanente (para que no cambie la firma en cada build)
          if [ -f "panbendito.keystore.b64" ]; then
            echo "Restaurando keystore release permanente..."
            base64 -d panbendito.keystore.b64 > panbendito.jks
          else
            echo "Generando keystore permanente para Pan Bendito..."
            keytool -genkeypair -v \
              -keystore panbendito.jks \
              -alias panbendito \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "PanBendito2026!" \
              -keypass "PanBendito2026!" \
              -dname "CN=PAN BENDITO, OU=Iglesia Pan Bendito, O=Iglesia Evangelica Pan Bendito, L=Madrid, ST=Madrid, C=ES"
            base64 -w 0 panbendito.jks > panbendito.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git add panbendito.keystore.b64
            git commit -m "chore: persist permanent keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Instalar dependencias Flutter
        working-directory: ./pan_bendito_app
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./pan_bendito_app
        run: flutter build apk --release

      - name: Renombrar y firmar con certificado Release oficial (Play Protect)
        working-directory: ./pan_bendito_app
        run: |
          mkdir -p release-output
          RAW_APK="build/app/outputs/flutter-apk/app-release.apk"
          
          # Localizar apksigner oficial de Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -n 1)
          echo "Usando apksigner en: $APKSIGNER"
          
          # Firmar APK con el certificado Release de Pan Bendito (v1, v2 y v3)
          $APKSIGNER sign --ks panbendito.jks \
            --ks-pass pass:PanBendito2026! \
            --key-pass pass:PanBendito2026! \
            --ks-key-alias panbendito \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-output/PanBendito.apk \
            "$RAW_APK"
          
          # Verificar la firma
          $APKSIGNER verify --verbose release-output/PanBendito.apk
          
          # Copia con nombre alternativo
          cp release-output/PanBendito.apk release-output/IglesiaPanBendito.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: IglesiaPanBendito-Android-APK
          path: pan_bendito_app/release-output/PanBendito.apk
          if-no-files-found: error

  build-admin-android:
    name: Compilar APK para Administradores (ADM PB)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de Android para ADM PB
        working-directory: ./pan_bendito_admin
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          mkdir -p backup_native
          cp -r android/app/src/main/res backup_native/ 2>/dev/null || true
          
          rm -rf android
          flutter create . --org com.iglesiapanbendito --project-name pan_bendito_admin --platforms=android
          cp pubspec.backup.yaml pubspec.yaml
          
          # Restaurar recursos visuales e iconos
          cp -rf backup_native/res/* android/app/src/main/res/ 2>/dev/null || true
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="ADM PB" android:usesCleartextTraffic="true"/g' "$MANIFEST"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"

          # Utilizar el mismo keystore release permanente
          if [ -f "../pan_bendito_app/panbendito.keystore.b64" ]; then
            base64 -d ../pan_bendito_app/panbendito.keystore.b64 > panbendito.jks
          else
            keytool -genkeypair -v \
              -keystore panbendito.jks \
              -alias panbendito \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "PanBendito2026!" \
              -keypass "PanBendito2026!" \
              -dname "CN=ADM PB, OU=Iglesia Pan Bendito, O=Iglesia Evangelica Pan Bendito, L=Madrid, ST=Madrid, C=ES"
          fi

      - name: Instalar dependencias Flutter
        working-directory: ./pan_bendito_admin
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./pan_bendito_admin
        run: flutter build apk --release

      - name: Renombrar y firmar con certificado Release oficial
        working-directory: ./pan_bendito_admin
        run: |
          mkdir -p release-output
          RAW_APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -n 1)
          echo "Usando apksigner en: $APKSIGNER"
          
          $APKSIGNER sign --ks panbendito.jks \
            --ks-pass pass:PanBendito2026! \
            --key-pass pass:PanBendito2026! \
            --ks-key-alias panbendito \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-output/AdmPB.apk \
            "$RAW_APK"
          
          $APKSIGNER verify --verbose release-output/AdmPB.apk

      - name: Subir APK de Admin como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: IglesiaPanBendito-Admin-APK
          path: pan_bendito_admin/release-output/AdmPB.apk
          if-no-files-found: error

  build-ios:
    name: Compilar version para iOS
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de iOS
        working-directory: ./pan_bendito_app
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          rm -rf ios
          flutter create . --org com.iglesiapanbendito --project-name pan_bendito_app --platforms=ios
          cp pubspec.backup.yaml pubspec.yaml
          
          # Inyectar esquemas de YouTube y nombre PAN BENDITO en Info.plist
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'PAN BENDITO'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'PAN BENDITO'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string vnd.youtube" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string youtube" "$PLIST" 2>/dev/null || true

      - name: Instalar dependencias Flutter
        working-directory: ./pan_bendito_app
        run: flutter pub get

      - name: Compilar version iOS (sin firma para pruebas)
        working-directory: ./pan_bendito_app
        run: flutter build ios --release --no-codesign

      - name: Subir artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: IglesiaPanBendito-iOS-Build
          path: pan_bendito_app/build/ios/iphoneos
