name: Compilar App Android e iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK para Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: ./pan_bendito_app

      - name: Compilar APK (Release)
        run: flutter build apk --release
        working-directory: ./pan_bendito_app

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PanBendito-Android-APK
          path: pan_bendito_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Compilar versión para iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: ./pan_bendito_app

      - name: Compilar para iOS (sin firma para pruebas)
        run: flutter build ios --release --no-codesign
        working-directory: ./pan_bendito_app

      - name: Subir artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: PanBendito-iOS-Build
          path: pan_bendito_app/build/ios/iphoneos
