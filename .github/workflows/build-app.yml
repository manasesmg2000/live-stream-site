name: Compilar App Android e iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK para Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de Android
        working-directory: ./pan_bendito_app
        run: |
          # Guardar copia de archivos Dart y assets
          cp pubspec.yaml pubspec.backup.yaml
          rm -rf android
          flutter create . --org com.iglesiapanbendito --project-name pan_bendito_app --platforms=android
          cp pubspec.backup.yaml pubspec.yaml
          
          # Inyectar permisos de internet y consultas de YouTube en AndroidManifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <queries>\n        <package android:name="com.google.android.youtube" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="vnd.youtube" />\n        </intent>\n    </queries>' "$MANIFEST"
          
          # Asegurar minSdkVersion 21 para el reproductor de YouTube
          GRADLE="android/app/build.gradle"
          if grep -q "minSdkVersion flutter.minSdkVersion" "$GRADLE"; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$GRADLE"
          fi

      - name: Instalar dependencias Flutter
        working-directory: ./pan_bendito_app
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./pan_bendito_app
        run: flutter build apk --release

      - name: Renombrar y preparar APK
        working-directory: ./pan_bendito_app
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/IglesiaPanBendito.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: IglesiaPanBendito-Android-APK
          path: pan_bendito_app/release-output/IglesiaPanBendito.apk
          if-no-files-found: error

  build-ios:
    name: Compilar versión para iOS
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de iOS
        working-directory: ./pan_bendito_app
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          rm -rf ios
          flutter create . --org com.iglesiapanbendito --project-name pan_bendito_app --platforms=ios
          cp pubspec.backup.yaml pubspec.yaml

      - name: Instalar dependencias Flutter
        working-directory: ./pan_bendito_app
        run: flutter pub get

      - name: Compilar versión iOS (sin firma para pruebas)
        working-directory: ./pan_bendito_app
        run: flutter build ios --release --no-codesign

      - name: Subir artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: IglesiaPanBendito-iOS-Build
          path: pan_bendito_app/build/ios/iphoneos
